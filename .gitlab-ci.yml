stages:
  - lint
  - test
  - audit

lint:
  image: python:3.11
  stage: lint
  script:
    - pip install ruff black mypy bandit
    - ruff check .
    - black --check .
    - mypy .
    - bandit -r .

test:
  image: python:3.11
  stage: test
  script:
    - pip install pytest pytest-cov
    - pytest --cov=. tests/

audit:
  image: python:3.11
  stage: audit
  script:
    - pip install pip-audit
    - pip-audit